base-app:
  nameOverride: sample-api
  pods:
    image:
      name: fcruzcoelho/sample-api
      tag: 1.0.0
      pullPolicy: Always

    env:
      - name: ENVIRONMENT
        value: production
      - name: HTTP_PORT
        value: "8080"
      - name: SERVICE_NAME
        value: sample-api
      - name: SERVICE_VERSION
        value: 0.1.0
      - name: REDIS_ADDR
        value: 192.168.10.143:6379
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "0.0.0.0:4317"
      - name: POSTGRES_DSN
        value: postgres://postgres:postgres@192.168.10.143:5432/sampledb?sslmode=disable

  service:
    enabled: true
    ports:
      - port: 80
        targetPort: 80
        protocol: TCP
        name: http

  rollout:
    enabled: true
