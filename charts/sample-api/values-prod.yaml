base-app:
  nameOverride: sample-api
  pods:
    image:
      name: fcruzcoelho/sample-api
      tag: 1.0.0
      pullPolicy: Always

    env:
      - name: ENVIRONMENT
        value: production
      - name: HTTP_PORT
        value: "8080"
      - name: SERVICE_NAME
        value: sample-api
      - name: SERVICE_VERSION
        value: 1.0.0
      - name: REDIS_ADDR
        value: 192.168.20.22:6379
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "grafana-alloy.grafana-alloy.svc.cluster.local:4317"
      - name: POSTGRES_DSN
        value: postgresql://sample-api:sample%40api@192.168.20.22:5432/sample-api?sslmode=disable

  service:
    enabled: true
    ports:
      - port: 80
        targetPort: 80
        protocol: TCP
        name: http

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

  rollout:
    enabled: true
